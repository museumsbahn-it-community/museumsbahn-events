name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to conserve free-tier minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle/JVM file handling is locale-sensitive; force UTF-8 so filenames
  # with umlauts (e.g. NostalgiebahnenKärntenCollector.kt) resolve correctly.
  # C.UTF-8 is used (not en_US.UTF-8) because it's a built-in glibc locale
  # that needs no locale-gen step, unlike en_US.UTF-8 which isn't generated
  # on the runner image and silently falls back to C/POSIX (mangling
  # multi-byte filenames, e.g. "ebfl_südbahn..." -> "ebfl_s??dbahn...").
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  gradle-build:
    name: Gradle build (backend, eventcollectors, api, dateparser-lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

  web-build:
    name: Frontend build (museum-railway-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: museum-railway-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: museum-railway-web/package-lock.json

      - run: npm ci

      - run: npm run build
