# Task-output cache: unchanged modules restore their compile/test outputs
# instead of rebuilding. Persisted across CI runs by gradle/actions/setup-gradle,
# which already caches the Gradle User Home (where the build cache lives).
org.gradle.caching=true

# Run independent module tasks concurrently (backend, eventcollectors, api,
# dateparser-lib are separate Gradle subprojects with no shared mutable state).
org.gradle.parallel=true
